<!-- Сторінка для відображення профілю користувача -->
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Налаштування метаданих та підключення стилів -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Контейнер для навігаційного меню -->
    <div id="navbar-container"></div>

    <!-- Заголовок профілю -->
    <div class="container mt-5 pt-5">
        <h3></h3>
    </div>

    <!-- Відображення профілю -->
    <div class="container mt-3">
        <div class="row">
            <div class="col-12 col-md-4 d-flex justify-content-center">
                <img src="img/avatar.png" class="rounded" alt="Rounded Image" style="width: 200px; height: 200px; object-fit: cover;">
            </div>
            <div class="col-12 col-md-8">
                <div class="p-3 border rounded bg-light">
                    <!-- Тут буде динамічно відображатися профіль -->
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер для футера -->
    <div id="footer-container"></div>

    <!-- Підключення скриптів -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="js/navbar.js"></script>
    <script type="module">
      import { ProfileView } from './js/views/profileView.js';
      import { UserController } from './js/controllers/userController.js';
      const profileView = new ProfileView();
      const currentUser = UserController.getCurrentUser();
      profileView.renderProfile(currentUser);
      if (currentUser) 
      {
        profileView.renderEditForm(currentUser);
        document.getElementById('editProfileForm').addEventListener('submit', (event) => 
        {
          event.preventDefault();
          currentUser.surname = document.getElementById('editSurname').value;
          currentUser.name = document.getElementById('editName').value;
          currentUser.patronymic = document.getElementById('editPatronymic').value;
          currentUser.avatarUrl = document.getElementById('editAvatar').value;
          currentUser.save();
          profileView.renderProfile(currentUser);
          const modal = bootstrap.Modal.getInstance(document.getElementById('editProfileModal'));
          modal.hide();
        });
      }
    </script>
</body>
</html>
